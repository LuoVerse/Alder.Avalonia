name: Windows release regression check
on:
  push:
    branches: [verify/preview-1-issues]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100
      - run: dotnet run --project tests/WindowsIssueProbe -c Release
      - run: dotnet test tests/Alder.Avalonia.Tests -c Release
      - run: dotnet run --project tests/Alder.Avalonia.AotSmoke -c Release
